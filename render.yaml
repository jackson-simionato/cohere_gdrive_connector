services:
  - type: web
    name: gdrive-connector
    env: python
    buildCommand: |
      pip install -r requirements.txt
      python -c "import nltk; nltk.download('stopwords', quiet=True); nltk.download('punkt', quiet=True); nltk.download('punkt_tab', quiet=True)"
    startCommand: python -c "from provider import create_app; app = create_app(); app.run(host='0.0.0.0', port=int('$PORT'), debug=False)"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: GDRIVE_SERVICE_ACCOUNT_INFO
        sync: false  # This will be set manually in Render dashboard
      - key: GDRIVE_CONNECTOR_API_KEY
        sync: false  # This will be set manually in Render dashboard
      - key: GDRIVE_SEARCH_LIMIT
        value: 10
      # Uncomment and set if you want to search a specific folder
      # - key: GDRIVE_FOLDER_ID
      #   value: your-folder-id-here
